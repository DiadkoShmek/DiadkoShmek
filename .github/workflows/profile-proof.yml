name: Profile proof

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  profile-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prove public discovery contract
        run: python3 -m unittest -v test_profile_discovery.py
