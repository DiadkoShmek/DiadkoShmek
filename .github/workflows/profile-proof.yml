name: Profile proof

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  profile-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove public discovery contract
        run: python3 -m unittest -v test_profile_discovery.py
